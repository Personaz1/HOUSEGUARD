services:
  core:
    ports:
      - "777:8000"
    environment:
      - UI_CORS_ORIGINS=http://localhost:666
      - SNAPSHOT_S3_ENDPOINT=
      - SNAPSHOT_S3_ACCESS_KEY=
      - SNAPSHOT_S3_SECRET_KEY=
      - SNAPSHOT_SOURCE_URL=
    depends_on:
      - mosquitto
  ui:
    environment:
      - VITE_API_BASE=http://localhost:777
    ports:
      - "666:80"
  mosquitto:
    ports:
      - "1883:1883"
      - "1884:9001"
