<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ΔΣ Guardian — Sign in</title>
    <link rel="stylesheet" href="{{ url_for('static', path='/css/guardian.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* Login-specific styles */
        body { background: radial-gradient(1000px 600px at 0% 0%, #0a1220 0%, #070b12 40%, #06080d 100%), #05070b; min-height: 100vh; margin:0; font-family: 'Inter', system-ui, -apple-system, Segoe UI, Roboto, sans-serif; color:#e5e7eb }
        
        .container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            position: relative;
        }
        
        .hearts { display:none }
        
        .login-card { background: rgba(16,24,36,.75); backdrop-filter: blur(8px); border:1px solid rgba(255,255,255,.06); border-radius: 16px; padding: 28px; text-align:center; max-width: 420px; width: 92%; position:relative; z-index:2 }
        
        .card-header {
            margin-bottom: 30px;
        }
        
        .logo { display:flex; align-items:center; justify-content:center; gap: 12px; margin-bottom:10px }
        
        .heart-icon { font-size: 1.8rem }
        
        .logo h1 { font-weight: 600; font-size: 1.3rem; margin:0; color:#c7d2fe; letter-spacing:.04em }
        
        .subtitle { color:#94a3b8; font-size:.9rem; margin:0 }
        
        .welcome-text {
            margin-bottom: 30px;
        }
        
        .welcome-text h2 { color:#e5e7eb; font-size:1.2rem; margin-bottom:10px }
        
        .welcome-text p { color:#a3b2c2; font-size:.95rem; line-height:1.5 }
        
        .error-message {
            background: #ff4757;
            color: white;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            text-align: center;
        }
        
        .login-form {
            margin-bottom: 30px;
        }
        
        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }
        
        .input-group label {
            display: block;
            color: #333;
            font-weight: 500;
            margin-bottom: 8px;
            font-size: 0.95rem;
        }
        
        .input-group input { width:100%; padding:12px 14px; border:1px solid rgba(255,255,255,.08); border-radius:10px; font-size:1rem; transition:.2s; box-sizing:border-box; background:#0b1119; color:#e5e7eb }
        
        .input-group input:focus { outline:none; border-color:#3b82f6; box-shadow:0 0 0 3px rgba(59,130,246,.15) }
        
        .login-btn { width:100%; padding:14px; background:#111827; color:#e5e7eb; border:1px solid rgba(255,255,255,.12); border-radius:10px; font-size:1rem; font-weight:600; cursor:pointer; transition:.2s; display:flex; align-items:center; justify-content:center; gap:10px }
        
        .login-btn:hover { transform: translateY(-1px); background:#0f172a }
        
        .btn-text {
            font-size: 1.1rem;
        }
        
        .btn-heart {
            font-size: 1.2rem;
        }
        
        .credentials-hint { display:none }
        
        .credentials-hint p {
            margin: 5px 0;
            color: #667eea;
            font-size: 0.9rem;
        }
        
        .card-footer {
            border-top: 1px solid #e1e5e9;
            padding-top: 20px;
        }
        
        .features {
            display: flex;
            justify-content: space-around;
            gap: 15px;
        }
        
        .feature {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }
        
        .feature-icon {
            font-size: 1.5rem;
        }
        
        .feature span:last-child {
            font-size: 0.8rem;
            color: #666;
        }
        
        .decorative-elements { display:none }
        
        .floating-rose {
            position: absolute;
            font-size: 2rem;
            animation: floatRose 8s ease-in-out infinite;
        }
        
        .floating-rose:nth-child(1) { top: 20%; left: 10%; animation-delay: 0s; }
        .floating-rose:nth-child(2) { top: 60%; left: 80%; animation-delay: 2s; }
        .floating-rose:nth-child(3) { top: 80%; left: 20%; animation-delay: 4s; }
        
        @keyframes floatRose {
            0%, 100% { transform: translateY(0) rotate(0deg); opacity: 0.3; }
            50% { transform: translateY(-20px) rotate(180deg); opacity: 1; }
        }
        
        @media (max-width: 768px) {
            .login-card {
                padding: 30px 20px;
                margin: 20px;
            }
            
            .logo h1 {
                font-size: 2rem;
            }
            
            .features {
                flex-direction: column;
                gap: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Floating hearts background -->
        <div class="hearts">
            <div class="heart"></div>
            <div class="heart"></div>
            <div class="heart"></div>
            <div class="heart"></div>
            <div class="heart"></div>
            <div class="heart"></div>
            <div class="heart"></div>
            <div class="heart"></div>
            <div class="heart"></div>
            <div class="heart"></div>
        </div>

        <!-- Main login card -->
        <div class="login-card">
            <div class="card-header">
            <div class="logo"><span class="heart-icon">🛡️</span><h1>ΔΣ Guardian</h1></div>
            <p class="subtitle">Secure Smart Home Console</p>
            </div>

            <div class="card-body">
                <div class="welcome-text"><h2>Sign in</h2><p>Authenticate to access your home control, chat, and system tools.</p></div>

                {% if error %}
                <div class="error-message">
                    {{ error }}
                </div>
                {% endif %}

                <form class="login-form" id="loginForm" method="POST" action="/login">
                    <div class="input-group">
                        <label for="username">Username</label>
                        <input type="text" id="username" name="username" required 
                               placeholder="Enter your username">
                    </div>

                    <div class="input-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" required 
                               placeholder="Enter your password">
                    </div>

                    <button type="submit" class="login-btn">
                        <span class="btn-text">Continue</span>
                        <span class="btn-heart">→</span>
                    </button>
                </form>

                <!-- Credentials removed for security -->
            </div>

            <div class="card-footer">
                <div class="features">
                    <div class="feature">
                        <span class="feature-icon">🧠</span>
                        <span>AI-Powered Insights</span>
                    </div>
                    <div class="feature">
                        <span class="feature-icon">💭</span>
                        <span>Personal Diaries</span>
                    </div>
                    <div class="feature">
                        <span class="feature-icon">🎯</span>
                        <span>Relationship Goals</span>
                    </div>
                </div>
            </div>
        </div>

        <div class="decorative-elements"></div>
    </div>

    <script src="{{ url_for('static', path='/js/login.js') }}"></script>
</body>
</html>
