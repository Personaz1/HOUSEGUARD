version: '3.8'

services:
  # Anti-Drone Simulation Environment
  guardian-sim:
    build:
      context: .
      dockerfile: Dockerfile.sim
    container_name: guardian-sim
    environment:
      - GUARDIAN_CORE_URL=http://guardian-core:8005
      - GUARDIAN_VISION_URL=http://guardian-vision:8002
      - GUARDIAN_SECURITY_URL=http://guardian-security:8003
      - GUARDIAN_COMFORT_URL=http://guardian-comfort:8004
      - MQTT_HOST=mosquitto
      - MQTT_PORT=1883
      - SIMULATION_MODE=integrated
      - LOG_LEVEL=INFO
    volumes:
      - ./scenarios:/app/scenarios
      - ./telemetry:/app/telemetry
      - ./reports:/app/reports
    depends_on:
      - mosquitto
      - guardian-core
      - guardian-vision
      - guardian-security
      - guardian-comfort
    networks:
      - guardian-network
    restart: unless-stopped
    command: ["python", "-m", "sim.anti_drone_runner", "--curriculum", "phase_a_basic"]

  # Simulation Web UI
  guardian-sim-ui:
    build:
      context: .
      dockerfile: Dockerfile.sim-ui
    container_name: guardian-sim-ui
    ports:
      - "8082:80"
    environment:
      - SIM_API_URL=http://guardian-sim:8000
      - GUARDIAN_API_URL=http://nginx:8081
    depends_on:
      - guardian-sim
    networks:
      - guardian-network
    restart: unless-stopped

  # Simulation Metrics Dashboard
  guardian-sim-grafana:
    image: grafana/grafana:latest
    container_name: guardian-sim-grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_INSTALL_PLUGINS=grafana-clock-panel,grafana-simple-json-datasource
    volumes:
      - sim-grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - guardian-sim
    networks:
      - guardian-network
    restart: unless-stopped

  # Simulation Prometheus
  guardian-sim-prometheus:
    image: prom/prometheus:latest
    container_name: guardian-sim-prometheus
    ports:
      - "9091:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    volumes:
      - sim-prometheus-data:/prometheus
      - ./monitoring/prometheus.sim.yml:/etc/prometheus/prometheus.yml
    depends_on:
      - guardian-sim
    networks:
      - guardian-network
    restart: unless-stopped

  # Simulation Data Storage
  guardian-sim-minio:
    image: minio/minio:latest
    container_name: guardian-sim-minio
    ports:
      - "9001:9000"
      - "9002:9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - sim-minio-data:/data
    depends_on:
      - guardian-sim
    networks:
      - guardian-network
    restart: unless-stopped

  # Simulation Database
  guardian-sim-postgres:
    image: postgres:15
    container_name: guardian-sim-postgres
    environment:
      - POSTGRES_DB=guardian_sim
      - POSTGRES_USER=guardian
      - POSTGRES_PASSWORD=guardian_pass
    volumes:
      - sim-postgres-data:/var/lib/postgresql/data
      - ./ops/postgres/init:/docker-entrypoint-initdb.d
    ports:
      - "5433:5432"
    networks:
      - guardian-network
    restart: unless-stopped

  # Simulation Vector Database
  guardian-sim-chroma:
    image: chromadb/chroma:latest
    container_name: guardian-sim-chroma
    environment:
      - CHROMA_SERVER_HOST=0.0.0.0
      - CHROMA_SERVER_HTTP_PORT=8000
      - CHROMA_SERVER_CORS_ALLOW_ORIGINS=["*"]
    volumes:
      - sim-chroma-data:/chroma/chroma
    ports:
      - "8001:8000"
    networks:
      - guardian-network
    restart: unless-stopped

  # Simulation Message Broker
  guardian-sim-kafka:
    image: confluentinc/cp-kafka:latest
    container_name: guardian-sim-kafka
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: guardian-sim-zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://guardian-sim-kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    ports:
      - "29092:29092"
    depends_on:
      - guardian-sim-zookeeper
    networks:
      - guardian-network
    restart: unless-stopped

  guardian-sim-zookeeper:
    image: confluentinc/cp-zookeeper:latest
    container_name: guardian-sim-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - guardian-network
    restart: unless-stopped

volumes:
  sim-grafana-data:
  sim-prometheus-data:
  sim-minio-data:
  sim-postgres-data:
  sim-chroma-data:

networks:
  guardian-network:
    external: true



